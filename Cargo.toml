[workspace]
members = ["crates/app-core", "crates/runtime-litert", "crates/n0-probe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/clevekim00/mj-llm"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"
