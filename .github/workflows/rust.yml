name: Rust contracts and CLI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --all -- --check
      - run: cargo +1.95.0 test --workspace --locked
      - run: cargo +1.95.0 clippy --workspace --all-targets --locked -- -D warnings
      # Host tests deliberately do not claim native inference/device validation.
